<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="做题攻城">
<title>做题攻城 · 城堡 PK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23FFF7F0'/%3E%3Cpath d='M28 68 L44 52' stroke='%23FFBE5C' stroke-width='10' stroke-linecap='round'/%3E%3Cpath d='M52 44 L72 24' stroke='%236FA8FF' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/pk.css">
<link rel="stylesheet" href="css/pk-battle.css">
<link rel="stylesheet" href="css/pk-atmosphere.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="stageCanvas"></canvas>

    <div id="hud" class="hide">
      <div class="side left">
        <div class="camp" id="campMe">蓝方 · 女将军</div>
        <div class="nm"><b id="nmMe">我</b><span id="troopMe">0</span><em class="lv" id="lvMe">Lv1</em></div>
        <div class="bar" role="progressbar" aria-label="我方城堡生命" aria-valuemin="0" aria-valuemax="100"><i id="hpMe"></i><span id="hpTextMe" class="hpText"></span></div>
      </div>
      <div class="center">
        <div class="clock-label">⚔ 对战时间 ⚔</div>
        <div class="clock" id="clock">00:00</div>
        <div class="combo" id="comboTag"></div>
        <div class="comboNext" id="comboNext"></div>
      </div>
      <button id="btnMute" class="mute" type="button" aria-label="声音开关">🔊</button>
      <div class="side right">
        <div class="camp" id="campOp">红方 · 男将军</div>
        <div class="nm"><b id="nmOp">对手</b><span id="troopOp">0</span><em class="lv" id="lvOp">Lv1</em></div>
        <div class="bar" role="progressbar" aria-label="对方城堡生命" aria-valuemin="0" aria-valuemax="100"><i id="hpOp"></i><span id="hpTextOp" class="hpText"></span></div>
      </div>
    </div>

    <details id="environmentMenu" class="environment-menu">
      <summary><span id="environmentLabel">☀ 10:00 · 晴空</span><span class="environment-chevron">⌃</span></summary>
      <div class="environment-options">
        <div class="environment-title">战场风景 <small>仅改变观赏效果</small></div>
        <label>时光<select id="timeMode"><option value="auto">自动昼夜</option><option value="dawn">晨曦</option><option value="noon">正午</option><option value="dusk">黄昏</option><option value="night">月夜</option></select></label>
        <label>天气<select id="weatherMode"><option value="auto">自动轮换</option><option value="clear">晴空</option><option value="wind">微风</option><option value="rain">细雨</option><option value="snow">飘雪</option><option value="fog">薄雾</option></select></label>
      </div>
    </details>
    <div id="banner" class="banner"></div>
    <div id="toast" class="toast"></div>
  </div>

  <div id="panel" class="hide">
    <div id="qmeta">
      <span class="tag" id="qtag">拼单词</span>
      <span class="score" id="score"></span>
      <button id="btnHint" class="hintbtn" type="button">
        <span class="ico">💡</span><span class="tx">提示</span><span class="cost">-25 血</span>
      </button>
    </div>
    <div id="qbody"></div>
  </div>

  <!-- ---------------- 大厅 ---------------- -->
  <div id="lobby" class="veil">
    <div class="card">
      <div class="crest">⚔️</div>
      <h1>做题攻城</h1>
      <p class="sub">拼单词 · 答语法 · 先把对面城堡推倒的人赢</p>

      <div class="whoRow">
        <span class="whoLabel">你的名字</span>
        <input id="whoInput" maxlength="12" placeholder="输入名字，马上开打" autocomplete="off">
      </div>
      <div class="fee" id="feeTag">自由对战 · 不扣星 · 输赢都能接着打</div>

      <div class="faction-choices" role="group" aria-label="选择阵营">
        <button type="button" data-faction-choice="female" aria-pressed="true"><span>⚜</span><b>女将军</b><small>蓝方</small></button>
        <button type="button" data-faction-choice="male" aria-pressed="false"><span>♜</span><b>男将军</b><small>红方</small></button>
      </div>
      <div class="deployment-choices" role="group" aria-label="选择出场位置">
        <button type="button" data-deployment="left" aria-pressed="true"><b>左侧出场 →</b><small>城堡、血条在左边</small></button>
        <button type="button" data-deployment="right" aria-pressed="false"><b>← 右侧出场</b><small>城堡、血条在右边</small></button>
      </div>
      <p class="faction-hint">阵营和左右位置可分别选择；加入好友时使用房间空余的阵营与位置</p>
      <button id="btnCreate" class="btn main">创建房间</button>
      <div class="join">
        <input id="codeInput" inputmode="numeric" maxlength="4" placeholder="房间号" autocomplete="off">
        <button id="btnJoin" class="btn ghost">加入</button>
      </div>

      <!-- AI 练功房：一个人也能打。四档只是「AI 出手多快、答对多准」，
           出兵 / 连击 / 城堡升级全走和真人同一套服务器逻辑 -->
      <div class="aiRow">
        <div class="aiTag">一个人？挑个对手直接开打 <i>不用等</i></div>
        <div class="aiChips">
          <button class="chip" data-ai="easy" type="button">入门</button>
          <button class="chip" data-ai="normal" type="button">普通</button>
          <button class="chip" data-ai="hard" type="button">高手</button>
          <button class="chip" data-ai="boss" type="button">宗师</button>
        </div>
      </div>

      <p class="hint" id="lobbyHint">两台设备连同一个 Wi-Fi：一个建房，另一个输房间号</p>
    </div>
  </div>

  <!-- ---------------- 等人 ---------------- -->
  <div id="wait" class="veil hide">
    <div class="card">
      <p class="tiny">房间号</p>
      <div class="code" id="roomCode">----</div>
      <p class="sub">让对手在另一台设备打开同一个网址，输入这个号</p>
      <p id="waitCamp" class="hint"></p>
      <div class="dots"><i></i><i></i><i></i></div>
      <p class="hint" id="waitFee">对手进来就自动开打</p>
      <button id="btnCancel" class="btn ghost">取消房间</button>
    </div>
  </div>

  <!-- ---------------- 结算 ---------------- -->
  <div id="result" class="veil hide">
    <div class="card">
      <div class="rtitle" id="rTitle">胜利</div>
      <div class="rsub" id="rSub"></div>
      <div class="rgrid">
        <div><b id="rTime">00:00</b><span>用时</span></div>
        <div><b id="rRight">0</b><span>答对</span></div>
        <div><b id="rWrong">0</b><span>答错</span></div>
        <div><b id="rStars">0</b><span>最高连击</span></div>
      </div>
      <div class="rwhy" id="rWhy"></div>
      <div class="rwrong" id="rWrongList"></div>
      <button id="btnHome" class="btn main">回到大厅</button>
      <button id="btnAgain" class="btn ghost">再来一局</button>
    </div>
  </div>

  <!-- 沙盒角标：index.html?free=1 才出现 -->
  <div id="sandboxTag" class="sandbox hide">沙盒 · 随便打</div>
</div>

<script type="module" src="js/pk/main.js"></script>
</body>
</html>
